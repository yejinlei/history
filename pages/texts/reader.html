<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">古籍目录</div>
    <div class="book-switch" id="bookSwitch"></div>
    <div id="toc"><div class="loading">加载目录…</div></div>
  </aside>
  <main class="main">
    <div id="view"><div class="loading">正在加载正文…</div></div>
  </main>
</div>

<div class="note-popup" id="popup">
  <span class="close-x" onclick="document.getElementById('popup').style.display='none'">✕</span>
  <span class="note-tag" id="popupTag">注</span><span id="popupText"></span>
</div>

<script>
const BOOKS = {
  shiji: { name:'史记', author:'[汉] 司马迁 撰', notes:'裴骃《集解》· 司马贞《索隐》· 张守节《正义》' },
  zizhitongjian: { name:'资治通鉴', author:'[宋] 司马光 撰', notes:'胡三省《音注》' }
};
const params = new URLSearchParams(location.search);
let bookKey = params.get('book') || 'shiji';
if (!BOOKS[bookKey]) bookKey = 'shiji';
let curCh = parseInt(params.get('ch') || '1', 10) || 1;
let indexData = [];
let noteStore = [];

const tocEl = document.getElementById('toc');
const viewEl = document.getElementById('view');
const popup = document.getElementById('popup');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderPara(p){
  let html = esc(p.text);
  html = html.replace(/⟦(\d+)⟧/g, (m, n) => {
    const idx = +n;
    const gi = noteStore.length;
    if (p.notes && p.notes[idx]) noteStore.push(p.notes[idx]);
    else noteStore.push({tag:'注', text:''});
    return '<sup class="note-mark" data-i="' + gi + '">' + (idx + 1) + '</sup>';
  });
  return html;
}

function showBookSwitch(){
  const el = document.getElementById('bookSwitch');
  el.innerHTML = Object.keys(BOOKS).map(k =>
    '<button class="' + (k === bookKey ? 'active' : '') + '" onclick="switchBook(\'' + k + '\')">' + BOOKS[k].name + '</button>'
  ).join('');
}
function switchBook(k){
  location.href = 'reader.html?book=' + k + '&ch=1';
}

function buildToc(){
  const groups = {};
  const order = [];
  indexData.forEach(item => {
    const g = item.section || '目次';
    if (!groups[g]) { groups[g] = []; order.push(g); }
    groups[g].push(item);
  });
  // 史记固定五体顺序
  const SORT = ['本纪','表','书','世家','列传','其他','编年'];
  order.sort((a,b)=> (SORT.indexOf(a)<0?99:SORT.indexOf(a)) - (SORT.indexOf(b)<0?99:SORT.indexOf(b)));
  let html = '';
  order.forEach(g => {
    html += '<div class="sidebar-section-title">' + esc(g) + '（' + groups[g].length + '）</div>';
    groups[g].forEach(item => {
      const label = BOOKS[bookKey].name === '史记'
        ? esc(item.title)
        : esc(item.juan + ' ' + (item.title || '').replace(/^卷[^・]*・?/, ''));
      html += '<a href="javascript:void(0)" data-ch="' + item.id + '" class="' + (item.id === curCh ? 'active' : '') + '">' + label + '</a>';
    });
  });
  tocEl.innerHTML = html;
  tocEl.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => loadChapter(+a.dataset.ch));
  });
}

function loadChapter(id){
  curCh = id;
  noteStore = [];
  window.scrollTo(0,0);
  viewEl.innerHTML = '<div class="loading">正在加载正文…</div>';
  fetch('../../data/texts/' + bookKey + '/ch/' + String(id).padStart(4,'0') + '.json')
    .then(r => r.json())
    .then(ch => {
      const meta = indexData.find(x => x.id === id) || {};
      const b = BOOKS[bookKey];
      const title = bookKey === 'shiji'
        ? (meta.juan ? meta.juan + '・' : '') + esc(meta.title)
        : esc(meta.title || '');
      let body = '';
      ch.paras.forEach(p => {
        const hasText = p.text && p.text.replace(/⟦\d+⟧/g, '').trim().length > 0;
        body += '<p class="' + (hasText ? '' : 'note-only') + '">' + renderPara(p) + '</p>';
      });
      viewEl.innerHTML =
        '<div class="chapter-header">' +
          '<div class="chapter-title">' + title + '</div>' +
          '<div class="chapter-meta"><span>' + esc(b.author) + '</span><span>注：' + esc(b.notes) + '</span>' +
          '<span>共 ' + ch.paras.length + ' 段</span></div>' +
        '</div>' +
        '<div class="toolbar">' +
          '<label>注疏显示：</label>' +
          '<button id="btnShow" class="active">显示上标</button>' +
          '<button id="btnHide">隐藏上标</button>' +
          '<span class="tip">点击正文中红色数字查看注疏</span>' +
        '</div>' +
        '<div class="content" id="content">' + body + '</div>' +
        '<div class="nav-buttons">' +
          '<a href="javascript:void(0)" id="prevBtn">← 上一篇</a>' +
          '<a href="javascript:void(0)" id="tocBtn">回目录</a>' +
          '<a href="javascript:void(0)" id="nextBtn">下一篇 →</a>' +
        '</div>';
      document.body.classList.remove('hide-notes');
      document.getElementById('btnShow').onclick = function(){
        document.body.classList.remove('hide-notes'); this.classList.add('active');
        document.getElementById('btnHide').classList.remove('active');
      };
      document.getElementById('btnHide').onclick = function(){
        document.body.classList.add('hide-notes'); this.classList.add('active');
        document.getElementById('btnShow').classList.remove('active');
        popup.style.display = 'none';
      };
      const prev = document.getElementById('prevBtn');
      const next = document.getElementById('nextBtn');
      if (id > 1) prev.onclick = () => loadChapter(id - 1); else prev.style.opacity = .4;
      if (id < indexData.length) next.onclick = () => loadChapter(id + 1); else next.style.opacity = .4;
      document.getElementById('tocBtn').onclick = () => { document.querySelector('.sidebar').scrollIntoView(); };
      history.replaceState(null, '', 'reader.html?book=' + bookKey + '&ch=' + id);
      // 高亮目录
      tocEl.querySelectorAll('a').forEach(a => a.classList.toggle('active', +a.dataset.ch === id));
      document.getElementById('content').addEventListener('click', onContentClick);
      const active = tocEl.querySelector('a.active');
      if (active) active.scrollIntoView({block:'nearest'});
    })
    .catch(e => { viewEl.innerHTML = '<div class="loading">正文加载失败：' + esc(e.message) + '</div>'; });
}

function onContentClick(e){
  const sup = e.target.closest('.note-mark');
  if (!sup) return;
  const note = noteStore[+sup.dataset.i];
  if (!note) return;
  document.getElementById('popupTag').textContent = note.tag || '注';
  document.getElementById('popupText').textContent = note.text;
  popup.style.display = 'block';
  const r = sup.getBoundingClientRect();
  const top = window.scrollY + r.bottom + 8;
  let left = window.scrollX + r.left - 20;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - 480;
  if (left > maxLeft) left = Math.max(10, maxLeft);
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

document.addEventListener('click', e => {
  if (!e.target.closest('.note-popup') && !e.target.closest('.note-mark')) popup.style.display = 'none';
});

showBookSwitch();
fetch('../../data/texts/' + bookKey + '/index.json')
  .then(r => r.json())
  .then(idx => { indexData = idx; buildToc(); loadChapter(curCh); })
  .catch(e => { tocEl.innerHTML = '<div class="loading">目录加载失败</div>'; });
</script>
