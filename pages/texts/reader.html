<script>

let curEnhance = null;     // enhancements 八类

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// —— 辅助：按章节id从chapter_index找到对应的文件路径，兜底按文件名模式匹配 ——
function chIdKey(id){ return String(id).padStart(4,'0'); }
function findBookMeta(bKey, chId){
  if (!chapterIndex) return null;
  // 先按"zizhitongjian-XXXX"匹配
  const want = bKey + '-' + chIdKey(chId);
  let item = chapterIndex.find(x => x.id === want);
  if (item) return item;
  item = chapterIndex.find(x => x.id && x.id.endsWith('-' + chIdKey(chId)));
  return item || null;
}
// 通过标题片段定位文件（兜底）
async function findAssetByPattern(dirUrl, prefix, titlePart){
  // titlePart 可能带「卷第三十・…」，简化匹配前缀
  try {
    // 兜底需要目录列表，但github pages无列目录能力，因此只在显式字段缺失时返回null
    return null;
  } catch(e){ return null; }
}
async function fetchText(url){
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.text();
  } catch(e){ return null; }
}
async function fetchJson(url){

}

// —— 解析译文 Markdown ——
function parseTranslation(md){
  if (!md) return null;
  const paras = [];
  const lines = md.split(/\r?\n/);
  let i = 0;
  let title = '';
  while (i < lines.length) {
    const line = lines[i];
    if (i === 0 && line.startsWith('# ')) { title = line.replace(/^#+\s*/,'').trim(); i++; continue; }
    const m = line.match(/^\*\*第(\d+)段（底本\s*p(\d+)）\*\*\s*$/);
    if (m) {
      const n = +m[1], pn = 'p' + m[2];
      let yw='', bh='', zh='';
      i++;
      while (i < lines.length) {
        const l = lines[i];
        if (l.match(/^\*\*第\d+段（底本/)) break;
        const ln = l.replace(/｜/g, '|');   // 兼容全角「｜」分隔符
        let mm;
        if ((mm = ln.match(/^>\s*原文\s*\|(.*)$/))) { yw = mm[1].replace(/^\d+/, '').trim(); }
        else if ((mm = ln.match(/^>\s*白话\s*\|(.*)$/))) { bh = mm[1].trim(); }
        else if ((mm = l.match(/^>\s*注\s*[:：]\s*(.*)$/))) { zh = mm[1].trim(); }
        i++;
      }
      paras.push({n, pn, yw, bh, zh});
      continue;
    }
    i++;
  }
  return {title, paras};
}

// —— 渲染原文（保留原逻辑）——
let curChData = null;
function renderPara(p){
  let html = esc(p.text);
  html = html.replace(/⟦(\d+)⟧/g, function(m, n){
    const idx = +n;
    const gi = noteStore.length;
    if (p.notes && p.notes[idx]) noteStore.push(p.notes[idx]);
    else noteStore.push({tag:'注', text:''});
    return '<sup class="note-mark" data-i="' + gi + '">' + (idx + 1) + '</sup>';
  });
  return html;
}
function renderOriginal(ch){
  let body = '';
  ch.paras.forEach(function(p){
    const hasText = p.text && p.text.replace(/⟦\d+⟧/g,'').trim().length > 0;
    body += '<p class="' + (hasText?'':'note-only') + '">' + renderPara(p) + '</p>';
  });
  return body;
}

// —— 渲染白话 ——
function renderBaihua(){
  if (!curTranslation || !curTranslation.final) {
    return '<div class="empty"><div class="ebox">本篇白话翻译尚未完成，正在按流水线逐卷翻译中。<br/>可先阅读原文与胡三省注。</div></div>';
  }
  const ps = curTranslation.final.paras;
  let html = '';
  ps.forEach(function(p){
    html += '<div class="baihua-block" id="bh-p' + p.n + '">' +
      '<span class="bh-num">第 ' + p.n + ' 段</span>' +
      '<div class="bh-text">' + renderMentionedText('final', p.n, p.bh) + '</div>' +
      (p.zh && p.zh !== '无。' && p.zh !== '无' ? '<div class="bh-note">' + esc(p.zh) + '</div>' : '') +
    '</div>';
  });
  return html;
}

// —— 渲染对照 ——
function renderDuizhao(){
  if (!curTranslation || !curTranslation.final) {
    return '<div class="empty"><div class="ebox">本篇白话翻译尚未完成，无法对照阅读。</div></div>';
  }
  // 原文段落来自curChData，按段落序号对齐（第n段=curChData.paras[n-1]）
  const ps = curTranslation.final.paras;
  const srcParas = curChData ? curChData.paras : [];
  let html = '';
  ps.forEach(function(p){
    const pi = (p.pn && /^p\d+$/.test(p.pn)) ? (+p.pn.slice(1)) : (p.n - 1);  // 以「底本 pN」声明为准对齐
    const src = srcParas[pi] || srcParas[p.n - 1];
    const ywText = src ? src.text.replace(/⟦\d+⟧/g,'') : p.yw;
    html += '<div class="duizhao-block" id="dz-p' + p.n + '">' +
      '<div class="dz-num">第 ' + p.n + ' 段</div>' +
      '<div class="dz-yw">' + esc(ywText) + '</div>' +
      '<div class="dz-bh">' + renderMentionedText('final', p.n, p.bh) + '</div>' +
      (p.zh && p.zh !== '无。' && p.zh !== '无' ? '<div class="dz-zh">' + esc(p.zh) + '</div>' : '') +
    '</div>';
  });
  return html;
}

// 把mention列表转为高亮HTML
function renderMentionedText(version, n, bhText, withTooltip){
  if (!curMentions || !curMentions[version]) return esc(bhText);
  const paraId = 'p' + n;
  const pm = curMentions[version].mentions.find(m => m.para_id === paraId);
  if (!pm || !pm.mentions || pm.mentions.length === 0) return esc(bhText);
  // 非重叠最大匹配排序
  const ms = pm.mentions.slice().sort((a,b)=>a.start-b.start);
  const clsMap = {person:'m-person', place:'m-place', concept:'m-concept'};
  let out = '';
  let cursor = 0;
  ms.forEach(function(m){
    if (m.start < cursor) return;
    out += esc(bhText.slice(cursor, m.start));
    const cls = clsMap[m.entity_type] || 'm-person';
    const eid = m.entity_id;
    const ename = m.entity_name;
    const surf = bhText.slice(m.start, m.end);
    const tipAttr = withTooltip ? ' data-eid="'+esc(eid)+'" data-ename="'+esc(ename)+'"' : '';
    out += '<span class="'+cls+'"'+tipAttr+'>' + esc(surf) + '</span>';
    cursor = m.end;
  });
  out += esc(bhText.slice(cursor));
  return out;
}

function renderProof(){
  const keys = Object.keys(curProofs);
  if (keys.length === 0) {
    return '<div class="empty"><div class="ebox">本篇校勘记/校验报告尚未生成。</div></div>';
  }
  let h = '';
  const nameMap = {'校勘':'一、底本校勘记（章钰胡注异文）','翻译校验':'二、白话译文互校记录','本体校验':'三、本体抽取校验报告'};
  keys.forEach(k => {
    h += '<div class="proofread-block"><h4>' + esc(nameMap[k]||k) + '</h4>' + formatMdSimple(curProofs[k]) + '</div>';
  });
  return h;
}
// 非常轻量的md格式化：支持#标题、列表、段落
function formatMdSimple(md){
  if (!md) return '';
  const lines = md.split(/\r?\n/);
  let out = '';
  lines.forEach(l => {
    if (l.startsWith('# ')) out += '<h4 style="color:#a33;margin:6px 0;">' + esc(l.slice(2)) + '</h4>';
    else if (l.startsWith('## ')) out += '<h5 style="color:#7a3030;margin:6px 0;">' + esc(l.slice(3)) + '</h5>';
    else if (/^[-*]\s/.test(l)) out += '<div style="padding-left:14px;">• ' + esc(l.replace(/^[-*]\s/,'')) + '</div>';
    else if (/^\d+\.\s/.test(l)) out += '<div style="padding-left:18px;">' + esc(l) + '</div>';
    else if (l.trim() === '') out += '';
    else out += '<div>' + esc(l) + '</div>';
  });
  return out;
}

function buildToc(){
  const groups = {};
  const order = [];
  indexData.forEach(function(item){
    const g = item.section || '目次';
    if (!groups[g]) { groups[g] = []; order.push(g); }
    groups[g].push(item);
  });
  const SORT = ['本纪','表','书','世家','列传','其他','编年','纪','传','志'];
  order.sort(function(a,b){
    const ia = SORT.indexOf(a) < 0 ? 99 : SORT.indexOf(a);
    const ib = SORT.indexOf(b) < 0 ? 99 : SORT.indexOf(b);
    return ia - ib;
  });
  // 标记是否有译文
  const hasTrans = {};
  if (chapterIndex) chapterIndex.forEach(m => {
    if (m.translation_file) {
      const nid = parseInt((m.id||'').split('-').pop(), 10);
      if (!isNaN(nid)) hasTrans[nid] = true;
    }
  });
  let html = '';
  order.forEach(function(g){
    html += '<div class="sidebar-section-title">' + esc(g) + '（' + groups[g].length + '）</div>';
    groups[g].forEach(function(item){
      let label;
      if (bookKey === 'shiji') {
        label = esc(item.title);
      } else {
        const t = (item.title || '').replace(/^卷[^・]*・?/, '');
        label = esc((item.juan ? item.juan + ' ' : '') + t);
      }
      const cls = 'toc-link' + (item.id === curCh ? ' active' : '') + (hasTrans[item.id] ? ' has-trans' : '');
      html += '<a href="javascript:void(0)" data-ch="' + item.id + '" class="' + cls + '">' + label + '</a>';
    });
  });
  tocEl.innerHTML = html;
  tocEl.querySelectorAll('a.toc-link').forEach(function(a){
    a.addEventListener('click', function(){ loadChapter(+a.dataset.ch); });
  });
}

// —— 工具栏 ——
function buildToolbar(meta){
  const hasTrans = !!(meta && meta.translation_file);
  const hasEnt = !!(meta && meta.entity_final);
  const hasEnh = !!(meta && meta.enhancement_file);
  const hasPf = !!(meta && meta.proofread_files && meta.proofread_files.length);
  const buttons = [
    {k:'original', t:'原文＋胡注', enabled:true},
    {k:'baihua', t:'白话译文', enabled:hasTrans},
    {k:'duizhao', t:'原文·白话对照', enabled:hasTrans},
    {k:'highlight', t:'实体高亮', enabled:hasTrans && hasEnt},
    {k:'entities', t:'本体抽取', enabled:hasEnt},
    {k:'enhance', t:'文本增强', enabled:hasEnh},
    {k:'proof', t:'校勘/校验', enabled:hasPf}
  ];
  let h = '<div class="toolbar"><div class="view-group">';
  buttons.forEach(b => {
    h += '<button data-view="'+b.k+'" class="' + (currentView===b.k?'active':'') + '"' + (b.enabled?'':' disabled') + '>' + b.t + '</button>';
  });

// —— 切换视图 ——
function switchView(v){
  currentView = v;
  history.replaceState(null, '', 'reader.html?book='+bookKey+'&ch='+curCh+'&view='+v);
  renderChapterBody();
}

// —— 加载章节（入口）——
async function loadChapter(id){
  curCh = id;
  noteStore = [];
  curTranslation = null; curEntities = null; curMentions = null; curEnhance = null; curProofs = {};
  curChapterMeta = null; curChData = null;
  window.scrollTo(0,0);
  viewEl.innerHTML = '<div class="loading">正在加载正文与翻译…</div>';
  // 1. 原文
  const ch = await fetchJson('../../data/texts/' + bookKey + '/ch/' + String(id).padStart(4,'0') + '.json');
  if (!ch) { viewEl.innerHTML = '<div class="loading">正文加载失败</div>'; return; }
  curChData = ch;
  // 2. 章节 meta
  curChapterMeta = findBookMeta(bookKey, id);
  // 3. 并行拉取资产
  const jobs = [];
  if (curChapterMeta) {
    if (curChapterMeta.translation_file) {
      jobs.push(fetchText('../../' + curChapterMeta.translation_file).then(md => {
        curTranslation = curTranslation || {};
        curTranslation.final = parseTranslation(md);
      }));
    }
    if (curChapterMeta.draft_translation_file) {
      jobs.push(fetchText('../../' + curChapterMeta.draft_translation_file).then(md => {
        curTranslation = curTranslation || {};
        curTranslation.draft = parseTranslation(md);
      }));
    }
    if (curChapterMeta.entity_final) {
      jobs.push(fetchJson('../../' + curChapterMeta.entity_final).then(j => { curEntities = curEntities||{}; curEntities.final = j; }));
    }
    if (curChapterMeta.entity_draft) {
      jobs.push(fetchJson('../../' + curChapterMeta.entity_draft).then(j => { curEntities = curEntities||{}; curEntities.draft = j; }));
    }
    if (curChapterMeta.annotation_file) {
      jobs.push(fetchJson('../../' + curChapterMeta.annotation_file).then(j => {
        curMentions = {final: j.final||j, draft: j.draft};
      }));
    }
    if (curChapterMeta.enhancement_file) {
      jobs.push(fetchJson('../../' + curChapterMeta.enhancement_file).then(j => { curEnhance = j; }));
    }
    if (curChapterMeta.proofread_files) {
      curChapterMeta.proofread_files.forEach(pf => {
        const label = pf.includes('校勘-') ? '校勘' : (pf.includes('翻译校验') ? '翻译校验' : (pf.includes('本体校验') ? '本体校验' : pf));
        jobs.push(fetchText('../../' + pf).then(md => { curProofs[label] = md; }));
      });
    }
  }
  await Promise.all(jobs);
  // 若当前视图不可用则回退
  const available = ['original'];
  if (curTranslation && curTranslation.final) { available.push('baihua','duizhao'); if (curMentions) available.push('highlight'); }
  if (curEntities && curEntities.final) available.push('entities');
  if (curEnhance) available.push('enhance');
  if (Object.keys(curProofs).length) available.push('proof');
  if (!available.includes(currentView)) currentView = 'original';

  renderChapterBody();
}

function renderChapterBody(){
  const ch = curChData;
  if (!ch) { viewEl.innerHTML = '<div class="loading">正文加载失败</div>'; return; }
  const meta = indexData.find(x => x.id === curCh) || {};
  const b = BOOKS[bookKey] || {name:'',author:'',notes:''};
  const title = bookKey === 'shiji'
    ? (meta.juan ? meta.juan + '・' : '') + esc(meta.title)
    : esc((meta.juan ? meta.juan + ' ' : '') + (meta.title || ''));
  // 徽标
  const badges = [];
  badges.push('<span class="badge">共 ' + ch.paras.length + ' 段</span>');
  if (curChapterMeta && curChapterMeta.char_count) badges.push('<span class="badge">' + (curChapterMeta.char_count>=10000?(curChapterMeta.char_count/10000).toFixed(1)+'万字':curChapterMeta.char_count+'字') + '</span>');
  if (curTranslation && curTranslation.final) badges.push('<span class="badge ok">白话定稿</span>');
  if (curEntities && curEntities.final) {
    const E = curEntities.final.entities||{};
    badges.push('<span class="badge ok">本体：人'+(E.persons?.length||0)+'·地'+(E.places?.length||0)+'·事'+(E.events?.length||0)+'·概'+(E.concepts?.length||0)+'</span>');
  }
  if (curEnhance) badges.push('<span class="badge ok">增强</span>');

  let body = '';
  switch(currentView){
    case 'baihua': body = renderBaihua(); break;
    case 'duizhao': body = renderDuizhao(); break;
    case 'highlight': body = renderHighlight(); break;
    case 'entities': body = renderEntities(); break;
    case 'enhance': body = renderEnhance(); break;
    case 'proof': body = renderProof(); break;
    case 'original':
    default:
      noteStore = [];
      body = renderOriginal(ch);
  }

  viewEl.innerHTML =
    '<div class="chapter-header">' +
      '<div class="chapter-title">' + title + '</div>' +
      '<div class="chapter-meta"><span>' + esc(b.author) + '</span><span>注：' + esc(b.notes||'') + '</span></div>' +
      '<div class="chapter-badges">' + badges.join('') + '</div>' +
    '</div>' +
    buildToolbar(curChapterMeta) +
    '<div class="content" id="content">' + body + '</div>' +
    '<div class="nav-buttons">' +
      '<a href="javascript:void(0)" id="prevBtn">← 上一篇</a>' +
      '<a href="javascript:void(0)" id="tocBtn">回目录</a>' +
      '<a href="javascript:void(0)" id="nextBtn">下一篇 →</a>' +
    '</div>';

  document.body.classList.remove('hide-notes');

  // toolbar 切换
  viewEl.querySelectorAll('.toolbar button[data-view]').forEach(btn => {
    btn.onclick = function(){ switchView(this.dataset.view); };
  });
  // 上下篇
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  if (curCh > 1) prev.onclick = function(){ loadChapter(curCh - 1); }; else prev.style.opacity = .4;
  if (curCh < indexData.length) next.onclick = function(){ loadChapter(curCh + 1); }; else next.style.opacity = .4;
  document.getElementById('tocBtn').onclick = function(){ document.querySelector('.sidebar').scrollIntoView(); };
  history.replaceState(null, '', 'reader.html?book='+bookKey+'&ch='+curCh+'&view='+currentView);
  tocEl.querySelectorAll('a.toc-link').forEach(function(a){ a.classList.toggle('active', +a.dataset.ch === curCh); });
  document.getElementById('content').addEventListener('click', onContentClick);
  const active = tocEl.querySelector('a.active');
  if (active) active.scrollIntoView({block:'nearest'});
}

function onContentClick(e){
  // 胡注上标
  const sup = e.target.closest('.note-mark');
  if (sup) {
    const note = noteStore[+sup.dataset.i];
    if (!note) return;
    document.getElementById('popupTag').textContent = note.tag || '注';
    document.getElementById('popupText').textContent = note.text || '';
    popup.style.display = 'block';
    const r = sup.getBoundingClientRect();
    const top = window.scrollY + r.bottom + 8;
    let left = window.scrollX + r.left - 20;
    const maxLeft = window.scrollX + document.documentElement.clientWidth - 480;
    if (left > maxLeft) left = Math.max(10, maxLeft);
    popup.style.top = top + 'px'; popup.style.left = left + 'px';
    etip.style.display = 'none';
    return;
  }
  // 实体高亮点击 / 悬浮
  const men = e.target.closest('.m-person,.m-place,.m-concept');
  if (men && men.dataset.eid && curEntities && curEntities.final) {
    showEntityTip(men);
    return;
  }
  popup.style.display='none'; etip.style.display='none';
}

function showEntityTip(el){
  const eid = el.dataset.eid;
  const E = curEntities.final.entities || {};
  const all = [...(E.persons||[]),...(E.places||[]),...(E.events||[]),...(E.concepts||[])];
  const ent = all.find(x => x.id === eid);
  if (!ent) return;
  document.getElementById('etipName').textContent = ent.name + (ent.alias && ent.alias.length ? '（' + ent.alias.join('、') + '）' : '');
  document.getElementById('etipNote').textContent = ent.note || '';
  etip.style.display = 'block';
  const r = el.getBoundingClientRect();
  const top = window.scrollY + r.bottom + 6;
  let left = window.scrollX + r.left;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - 340;
  if (left > maxLeft) left = Math.max(10, maxLeft);
  etip.style.top = top + 'px'; etip.style.left = left + 'px';
}

document.addEventListener('click', function(e){
  if (!e.target.closest('.note-popup') && !e.target.closest('.note-mark')) popup.style.display='none';
  if (!e.target.closest('.entity-tooltip') && !e.target.closest('.m-person') && !e.target.closest('.m-place') && !e.target.closest('.m-concept')) etip.style.display='none';
});

// —— 启动：先 books 列表，再 index，再 chapter_index，再 loadChapter ——
fetch('../../data/texts/books.json')
  .then(r => r.json())
  .then(list => {
    bookList = list;
    list.forEach(b => BOOKS[b.key] = b);
    if (!BOOKS[bookKey]) bookKey = list[0].key;
    renderBookSelect();
    return fetch('../../data/texts/' + bookKey + '/index.json');
  })
  .then(r => r.json())
  .then(idx => {
    indexData = idx;
    // 加载chapter_index
    return fetch('../../data/books/' + bookKey + '/chapter_index.json').then(r => r.ok ? r.json() : null).catch(() => null);
  })
  .then(ci => {
    chapterIndex = ci || [];
    buildToc();
    // 校正 curCh 在indexData范围内
    if (!indexData.find(x => x.id === curCh)) curCh = indexData[0].id;
    loadChapter(curCh);
  })
  .catch(e => { tocEl.innerHTML = '<div class="loading">目录加载失败：' + esc(e.message) + '</div>'; });
</script>
