.toolbar { display:flex; align-items:center; gap:14px; padding:11px 18px; background:#fff8e8; border:1px solid #d4c5a0; border-left:4px solid #a33; margin-bottom:28px; border-radius:3px; font-size:13.5px; flex-wrap:wrap; }
.toolbar label { color:#7a6a4f; }
.toolbar button { padding:6px 15px; border:1px solid #c9b48a; background:#f5efe0; color:#3a2e1f; border-radius:3px; cursor:pointer; font-family:inherit; font-size:13.5px; }
.toolbar button.active, .toolbar button:hover { background:#a33; color:#fff8e8; border-color:#a33; }

.content { font-size:17.5px; line-height:2.15; color:#2a1e0f; }
.content p { text-indent:2em; margin-bottom:7px; }
.content p.note-only { text-indent:2em; color:#7a5a3a; font-size:15.5px; padding-left:1.5em; border-left:2px solid #e0d2b0; margin:6px 0 10px; }
sup.note-mark { color:#a33; font-weight:bold; cursor:pointer; font-size:12px; padding:0 2px; margin:0 1px; border-radius:2px; user-select:none; }
sup.note-mark:hover { background:#a33; color:#fff8e8; }
body.hide-notes sup.note-mark { display:none; }
.note-popup { position:absolute; background:#fffdf5; border:1px solid #c9b48a; border-left:4px solid #a33; padding:14px 18px; border-radius:3px; box-shadow:0 6px 22px rgba(100,60,20,0.22); max-width:460px; font-size:15px; line-height:1.85; color:#4a3f2c; z-index:300; display:none; }
.note-popup .note-tag { display:inline-block; background:#a33; color:#fff; padding:1px 9px; border-radius:2px; font-size:12px; margin-right:8px; vertical-align:1px; }
.note-popup .close-x { float:right; cursor:pointer; color:#a33; font-weight:bold; margin-left:10px; }
.nav-buttons { display:flex; justify-content:space-between; margin-top:46px; padding-top:22px; border-top:1px solid #d4c5a0; gap:12px; }
.nav-buttons a { padding:10px 22px; background:#fff8e8; border:1px solid #c9b48a; color:#3a2e1f; text-decoration:none; border-radius:3px; font-size:14px; }
.nav-buttons a:hover { background:#a33; color:#fff8e8; border-color:#a33; }

@media (max-width:920px) {
  .sidebar { display:none; }
  .main { padding:22px 18px; }

  .navbar { gap:14px; padding:10px 14px; }
}

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">古籍目录</div>
    <select class="book-select" id="bookSelect"></select>
    <div id="toc"><div class="loading">加载目录…</div></div>
  </aside>
  <main class="main">
    <div id="view"><div class="loading">正在加载正文…</div></div>
  </main>
</div>

<div class="note-popup" id="popup">
  <span class="close-x" onclick="document.getElementById('popup').style.display='none'">✕</span>
  <span class="note-tag" id="popupTag">注</span><span id="popupText"></span>
</div>

<script>
let BOOKS = {};
let bookList = [];
const params = new URLSearchParams(location.search);
let bookKey = params.get('book') || 'shiji';
let curCh = parseInt(params.get('ch') || '1', 10) || 1;
let indexData = [];
let noteStore = [];

const tocEl = document.getElementById('toc');
const viewEl = document.getElementById('view');
const popup = document.getElementById('popup');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderPara(p){
  let html = esc(p.text);
  html = html.replace(/⟦(\d+)⟧/g, function(m, n){
    const idx = +n;
    const gi = noteStore.length;
    if (p.notes && p.notes[idx]) noteStore.push(p.notes[idx]);
    else noteStore.push({tag:'注', text:''});
    return '<sup class="note-mark" data-i="' + gi + '">' + (idx + 1) + '</sup>';
  });
  return html;
}

function renderBookSelect(){
  const sel = document.getElementById('bookSelect');
  sel.innerHTML = bookList.map(function(b){
    const mark = b.style === 'annotated' ? '（带注）' : '';
    return '<option value="' + b.key + '"' + (b.key === bookKey ? ' selected' : '') + '>《' + b.name + '》' + mark + ' · ' + b.count + '篇</option>';
  }).join('');
  sel.onchange = function(){ location.href = 'reader.html?book=' + this.value + '&ch=1'; };
}

function buildToc(){
  const groups = {};
  const order = [];
  indexData.forEach(function(item){
    const g = item.section || '目次';
    if (!groups[g]) { groups[g] = []; order.push(g); }
    groups[g].push(item);
  });
  const SORT = ['本纪','表','书','世家','列传','其他','编年','纪','传','志'];
  order.sort(function(a,b){
    const ia = SORT.indexOf(a) < 0 ? 99 : SORT.indexOf(a);
    const ib = SORT.indexOf(b) < 0 ? 99 : SORT.indexOf(b);
    return ia - ib;
  });
  let html = '';
  order.forEach(function(g){
    html += '<div class="sidebar-section-title">' + esc(g) + '（' + groups[g].length + '）</div>';
    groups[g].forEach(function(item){
      let label;
      if (bookKey === 'shiji') {
        label = esc(item.title);
      } else {
        const t = (item.title || '').replace(/^卷[^・]*・?/, '');
        label = esc((item.juan ? item.juan + ' ' : '') + t);
      }
      html += '<a href="javascript:void(0)" data-ch="' + item.id + '" class="' + (item.id === curCh ? 'active' : '') + '">' + label + '</a>';
    });
  });
  tocEl.innerHTML = html;
  tocEl.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ loadChapter(+a.dataset.ch); });
  });
}

function loadChapter(id){
  curCh = id;
  noteStore = [];
  window.scrollTo(0,0);
  viewEl.innerHTML = '<div class="loading">正在加载正文…</div>';
  fetch('../../data/texts/' + bookKey + '/ch/' + String(id).padStart(4,'0') + '.json')
    .then(function(r){ return r.json(); })
    .then(function(ch){
      const meta = indexData.find(function(x){ return x.id === id; }) || {};
      const b = BOOKS[bookKey] || {name:'', author:'', notes:''};
      const title = bookKey === 'shiji'
        ? (meta.juan ? meta.juan + '・' : '') + esc(meta.title)
        : esc((meta.juan ? meta.juan + ' ' : '') + (meta.title || ''));
      let body = '';
      ch.paras.forEach(function(p){
        const hasText = p.text && p.text.replace(/⟦\d+⟧/g, '').trim().length > 0;
        body += '<p class="' + (hasText ? '' : 'note-only') + '">' + renderPara(p) + '</p>';
      });
      const noteLine = b.notes ? '<span>注：' + esc(b.notes) + '</span>' : '<span>原文（注疏建设中）</span>';
      const toolbar = b.style === 'annotated'
        ? '<div class="toolbar"><label>注疏显示：</label>' +
          '<button id="btnShow" class="active">显示上标</button>' +
          '<button id="btnHide">隐藏上标</button>' +
          '<span class="tip">点击正文中红色数字查看注疏</span></div>'
        : '';
      viewEl.innerHTML =
        '<div class="chapter-header">' +
          '<div class="chapter-title">' + title + '</div>' +
          '<div class="chapter-meta"><span>' + esc(b.author) + '</span>' + noteLine +
          '<span>共 ' + ch.paras.length + ' 段</span></div>' +
        '</div>' + toolbar +
        '<div class="content" id="content">' + body + '</div>' +
        '<div class="nav-buttons">' +
          '<a href="javascript:void(0)" id="prevBtn">← 上一篇</a>' +
          '<a href="javascript:void(0)" id="tocBtn">回目录</a>' +
          '<a href="javascript:void(0)" id="nextBtn">下一篇 →</a>' +
        '</div>';
      document.body.classList.remove('hide-notes');
      if (document.getElementById('btnShow')) {
        document.getElementById('btnShow').onclick = function(){
          document.body.classList.remove('hide-notes'); this.classList.add('active');
          document.getElementById('btnHide').classList.remove('active');
        };
        document.getElementById('btnHide').onclick = function(){
          document.body.classList.add('hide-notes'); this.classList.add('active');
          document.getElementById('btnShow').classList.remove('active');
          popup.style.display = 'none';
        };
      }
      const prev = document.getElementById('prevBtn');
      const next = document.getElementById('nextBtn');
      if (id > 1) prev.onclick = function(){ loadChapter(id - 1); }; else prev.style.opacity = .4;
      if (id < indexData.length) next.onclick = function(){ loadChapter(id + 1); }; else next.style.opacity = .4;
      document.getElementById('tocBtn').onclick = function(){ document.querySelector('.sidebar').scrollIntoView(); };
      history.replaceState(null, '', 'reader.html?book=' + bookKey + '&ch=' + id);
      tocEl.querySelectorAll('a').forEach(function(a){ a.classList.toggle('active', +a.dataset.ch === id); });
      document.getElementById('content').addEventListener('click', onContentClick);
      const active = tocEl.querySelector('a.active');
      if (active) active.scrollIntoView({block:'nearest'});
    })
    .catch(function(e){ viewEl.innerHTML = '<div class="loading">正文加载失败：' + esc(e.message) + '</div>'; });
}

function onContentClick(e){
  const sup = e.target.closest('.note-mark');
  if (!sup) return;
  const note = noteStore[+sup.dataset.i];
  if (!note) return;
  document.getElementById('popupTag').textContent = note.tag || '注';
  document.getElementById('popupText').textContent = note.text;
  popup.style.display = 'block';
  const r = sup.getBoundingClientRect();
  const top = window.scrollY + r.bottom + 8;
  let left = window.scrollX + r.left - 20;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - 480;
  if (left > maxLeft) left = Math.max(10, maxLeft);
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

document.addEventListener('click', function(e){
  if (!e.target.closest('.note-popup') && !e.target.closest('.note-mark')) popup.style.display = 'none';
});

fetch('../../data/texts/books.json')
  .then(function(r){ return r.json(); })
  .then(function(list){
    bookList = list;
    list.forEach(function(b){ BOOKS[b.key] = b; });
    if (!BOOKS[bookKey]) bookKey = list[0].key;
    renderBookSelect();
    return fetch('../../data/texts/' + bookKey + '/index.json');
  })
  .then(function(r){ return r.json(); })
  .then(function(idx){ indexData = idx; buildToc(); loadChapter(curCh); })
  .catch(function(e){ tocEl.innerHTML = '<div class="loading">目录加载失败</div>'; });
</script>
