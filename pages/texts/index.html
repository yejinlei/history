.book-card .bc-notes { font-size:13px; color:#8a5a3a; background:#f7efdc; border-left:3px solid #c9a05a; padding:7px 12px; border-radius:0 3px 3px 0; }
.book-card .bc-enter { margin-top:14px; font-size:13.5px; color:#a33; font-weight:bold; }

<div class="wrap">
  <h1 class="page-title">正史文本库</h1>
  <p class="page-desc">收录正史原文。带注者正文红色上标对应古人注疏，点击即可查看</p>
  <div id="booksArea"><div class="loading">正在加载书目…</div></div>
</div>

<script>
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
fetch('../../data/texts/books.json').then(function(r){ return r.json(); }).then(function(list){
  const anno = list.filter(function(b){ return b.style === 'annotated'; });
  const plain = list.filter(function(b){ return b.style !== 'annotated'; });
  let html = '';
  html += '<div class="sec-title">带注全文 · ' + anno.length + ' 部</div><div class="book-grid">';
  html += anno.map(function(b){
    return '<a href="reader.html?book=' + b.key + '" class="book-card">' +
      '<div class="bc-name">' + esc(b.name) + '<span class="bc-tag">已上线</span></div>' +
      '<div class="bc-meta">' + esc(b.author) + '<br>共 ' + b.count + ' 篇</div>' +
      '<div class="bc-notes">' + esc(b.notes) + '</div>' +
      '<div class="bc-enter">进入阅读 →</div></a>';
  }).join('');
  html += '</div>';
  html += '<div class="sec-title">原文全文 · ' + plain.length + ' 部</div><div class="mini-grid">';
  html += plain.map(function(b){
    return '<a href="reader.html?book=' + b.key + '" class="mini-card">' +
      '<span class="mc-cnt">' + b.count + '篇</span>' +
      '<span class="mc-name">《' + esc(b.name) + '》</span>' +
      '<span class="mc-note">' + esc(b.author) + '</span></a>';
  }).join('');
  html += '</div>';
  document.getElementById('booksArea').innerHTML = html;
}).catch(function(){
  document.getElementById('booksArea').innerHTML = '<div class="loading">书目加载失败</div>';
});
</script>
